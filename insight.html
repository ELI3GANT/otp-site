    body { background: #030305; color: #fff; margin: 0 !important; font-family: 'Inter', sans-serif; }

  <script>
    document.addEventListener("DOMContentLoaded", async () => {
        const params = new URLSearchParams(window.location.search);
        const rawSlug = params.get('slug');
        const slug = (window.OTP && typeof window.OTP.sanitizeSlugParam === 'function')
            ? window.OTP.sanitizeSlugParam(rawSlug)
            : String(rawSlug || '').trim();
        if (!slug) { window.location.href = 'insights.html'; return; }

        const BAKED_POSTS = {
            'spooky-luh-ooky': {
                id: 'baked-1',
                title: 'Deconstruction: Spooky (Luh Ooky)',
                slug: 'spooky-luh-ooky',
                category: 'Visuals',
                created_at: '2026-01-08T12:00:00Z',
                image_url: 'assets/seo/otp-og-image.webp',
                content: `### Visual Architecture & Atmospheric Direction

OnlyTruePerspective deconstructs the aesthetic markers that define the dark-modernist visual rollout:

* **High-Contrast Low-Key Lighting**: Combining deep shadows with sharp cyan and magenta accents to isolate subjects with striking visual weight.
* **Transient-Based Motion Synchronization**: Precision editing cut directly to 808 transients, snares, and vocal stabs for maximum viewer retention.
* **Cinematic Color Grading**: Muted deep blacks mixed with vibrant highlights to give digital footage an analog film feel.

> "Visual direction isn't just styling—it's creating an inescapable atmosphere that commands attention." — ELI3GANT`
            },
            'whats-elegant-about-eli3gant': {
                id: 'baked-2',
                title: 'The Architecture of ELI3GANT',
                slug: 'whats-elegant-about-eli3gant',
                category: 'Strategy',
                created_at: '2026-01-12T12:00:00Z',
                image_url: 'assets/seo/otp-og-image.webp',
                content: `### Strategic Core & Brand Foundation

OnlyTruePerspective bridges high-end media production with modern web architecture and automation pipelines:

* **Unified Brand Identity**: Building cohesive visual identities across cinematic music videos, web applications, and physical release rollouts.
* **Technical & Tactical Execution**: Deploying custom client management portals, instant booking intake pipelines, and automated CRM workflows.
* **Directorial Autonomy**: Maintaining 100% creative control while helping independent creators and brands scale efficiently.

> "We don't just edit visuals; we build the infrastructure for projects that move the needle." — ELI3GANT`
            },
            '24h-tech-repair-fixline-playbook': {
                id: 'baked-3',
                title: '24h FIXLINE: Emergency Tech Diagnostics & Repair Playbook',
                slug: '24h-tech-repair-fixline-playbook',
                category: 'Strategy',
                created_at: '2026-01-20T12:00:00Z',
                image_url: 'assets/seo/otp-og-image.webp',
                content: `### Rapid Tech Diagnostics & Hotfix Architecture

When business websites, client portals, or automation pipelines break, speed and accuracy are everything:

* **Root-Cause Analysis**: Isolating underlying API breaks, database schema mismatches, or route failures instead of applying temporary patches.
* **Automated Client Intake & Triage**: Capturing diagnostic signals via the 24h FIXLINE portal to initiate immediate scoping.
* **24-72h Hotfix Deployment**: Refactoring broken codebases, updating auth flows, and deploying zero-downtime production patches.

> "A broken site or failing intake funnel costs revenue every hour it sits idle. FIXLINE restores momentum in 24 hours." — OTP Engineering`
            },
            'next-gen-web-portals-for-creators': {
                id: 'baked-4',
                title: 'High-Converting Client Portals: Elevating Creator Commerce',
                slug: 'next-gen-web-portals-for-creators',
                category: 'Visuals',
                created_at: '2026-01-24T12:00:00Z',
                image_url: 'assets/seo/otp-og-image.webp',
                content: `### The Shift From Static Pages to Interactive Portals

Static landing pages are no longer enough to manage complex creative services and client relationships:

* **Interactive Milestone Dashboards**: Giving clients real-time visibility into project status, asset deliverables, and approval stages.
* **Frictionless Intake & Payments**: Integrating secure payment links and deposit steps directly into intake flows to boost conversions.
* **Glassmorphic UI Design**: Delivering a sleek, dark-mode user experience that matches the quality of high-end media productions.

> "Modern clients don't want email clutter—they want a clean, dedicated portal to manage their projects." — OnlyTruePerspective`
            }
        };

        // Wait for OTP_CONFIG to be available
        let attempts = 0;
        while (!window.OTP_CONFIG && attempts < 10) {
            await new Promise(r => setTimeout(r, 100));
            attempts++;
        }

        let post = null;
        try {
            if (window.supabase && window.OTP_CONFIG && typeof window.OTP?.getSupabase === 'function') {
                const supabase = window.OTP.getSupabase();
                const { data, error } = await supabase
                    .from('posts')
                    .select('*')
                    .eq('slug', slug)
                    .neq('slug', 'system-global-state')
                    .eq('published', true)
                    .single();

                if (!error && data) post = data;
            }
        } catch (e) {
            // Silently handle offline / config fallback
        }

        if (!post && BAKED_POSTS[slug]) {
            post = BAKED_POSTS[slug];
        }

        try {
            if (!post) throw new Error("POST_NOT_FOUND");

            // --- Update Page Meta ---
            document.title = `${post.title} | OnlyTruePerspective`;
            const postTitleEl = document.getElementById('postTitle');
            const postMetaEl = document.getElementById('postMeta');
            if (postTitleEl) postTitleEl.innerText = post.title || '';
            if (postMetaEl) postMetaEl.innerText = `${new Date(post.created_at).toLocaleDateString('en-US', {month:'long', day:'numeric', year:'numeric'})} • ${post.category || 'Insight'}`;

            // Dynamically update OG tags for proper social sharing
            const postExcerpt = (post.excerpt || post.content || '').replace(/<[^>]*>/g, '').substring(0, 160);
            const safeHero = (window.OTP && typeof window.OTP.sanitizeHttpUrl === 'function')
                ? window.OTP.sanitizeHttpUrl(post.image_url)
                : '';
            const postImage = safeHero || 'https://www.onlytrueperspective.tech/assets/seo/otp-og-image.webp';
            const postUrl = `https://www.onlytrueperspective.tech/insight.html?slug=${encodeURIComponent(slug)}`;
            document.querySelector('meta[property="og:title"]')?.setAttribute('content', `${post.title} | OnlyTruePerspective`);
            document.querySelector('meta[property="og:description"]')?.setAttribute('content', postExcerpt);
            document.querySelector('meta[property="og:image"]')?.setAttribute('content', postImage);
            document.querySelector('meta[property="og:url"]')?.setAttribute('content', postUrl);
            document.querySelector('meta[name="twitter:title"]')?.setAttribute('content', post.title);
            document.querySelector('meta[name="twitter:description"]')?.setAttribute('content', postExcerpt);
            document.querySelector('meta[name="twitter:image"]')?.setAttribute('content', postImage);
            // --- FIRE LIVE TRAFFIC SIGNAL ---
            if (window.OTP && typeof window.OTP.trackView === 'function') {
                window.OTP.trackView(slug);
            }
            
            const body = document.getElementById('postBody');
            if (!body) throw new Error('CONFIG_MISSING');
            const raw = post.content || '';
            let html = '';
            if (typeof marked !== 'undefined') {
                html = marked.parse(raw);
            } else {
                html = raw || '<p>No content available.</p>';
            }
            body.innerHTML = window.OTP.sanitizeHtml(html);

            // Fix the return link to use dynamic theme and better styling
            const footerNav = document.createElement('div');
            footerNav.style.cssText = 'text-align:center; margin-top:80px; padding-top:40px; border-top:1px solid rgba(var(--accent2-rgb), 0.1);';
            footerNav.innerHTML = `
                <a href='insights.html' style='color:var(--accent2); text-decoration:none; font-weight:bold; letter-spacing:2px; font-family:"Space Grotesk",sans-serif; border:1px solid rgba(var(--accent2-rgb), 0.3); padding:12px 24px; border-radius:8px; display:inline-block;' class='k-hover'>↩ RETURN TO VAULT</a>
            `;
            body.appendChild(footerNav);
            
            if (safeHero) {
                const img = document.getElementById('postImg');
                if (img) {
                    img.src = safeHero;
                    img.alt = post.title || '';
                    img.loading = 'lazy';
                    img.style.display = 'block';
                }
            }

            // Reveal content, hide loader
            const loaderEl = document.getElementById('loader');
            if (loaderEl) loaderEl.style.display = 'none';
            body.style.display = 'block';

        } catch (e) {
            console.error("Uplink Error:", e);
            const loaderErr = document.getElementById('loader');
            if (loaderErr) loaderErr.style.display = 'none';
            const titleEl = document.getElementById('postTitle');
            const msg = String(e && e.message != null ? e.message : e);
            const body = document.getElementById('postBody');
            if (titleEl) {
                titleEl.innerText = msg === 'POST_NOT_FOUND' ? "SIGNAL NOT FOUND"
                    : msg === 'CONFIG_MISSING' ? "CONFIGURATION ERROR" : "UPLINK ERROR";
            }
            if (body) {
                body.style.display = 'block';
                const detail = msg === 'POST_NOT_FOUND'
                    ? 'This transmission has been archived or does not exist.'
                    : msg === 'CONFIG_MISSING'
                    ? 'Required scripts did not load. Try a hard refresh or disable extensions that block CDNs.'
                    : 'Connection lost. Please try again.';
                body.innerHTML = `<div style='text-align:center; padding: 60px 40px;'>
                    <p style='color:var(--muted); margin-bottom:30px;'>${detail}</p>
                    <a href='insights.html' style='color:var(--accent2); text-decoration:none; font-weight:bold; letter-spacing:2px; font-family:\'Space Grotesk\',sans-serif; border:1px solid rgba(var(--accent2-rgb), 0.35); padding:12px 24px; border-radius:8px;'>↩ RETURN TO VAULT</a>
                </div>`;
            }
        }
    });
  </script>
