# Production deploys are handled by .github/workflows/production-release.yml after the clean scoped gate passes.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify pinned OTP contracts
        run: npm run contracts:verify

      - name: Verify scoped release guard shape
        run: npm run release:scope

      - name: Master test suite (isolated from live mutation APIs)
        env:
          LIVE_API_URL: ""
        run: npm test

      - name: Secret/security scan
        run: npm run security:scan

      - name: Speed Insights bundle check
        run: npm run build:speed-insights

      - name: Build if defined
        run: npm run build --if-present

  windows-test:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      LIVE_API_URL: ""
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify pinned OTP contracts
        run: npm run contracts:verify

      - name: Verify scoped release guard shape
        run: npm run release:scope

      - name: Master test suite
        run: npm test

      - name: Secret/security scan
        run: npm run security:scan

      - name: Speed Insights bundle check
        run: npm run build:speed-insights

      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=low
