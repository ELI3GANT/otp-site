name: One-time FloorOps dependency audit repair

on:
  push:
    branches:
      - design/floorops-sitewide-typography-20261027
    paths:
      - .github/workflows/repair-floorops-audit.yml

permissions:
  contents: write

jobs:
  repair-lockfile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Update vulnerable dependency lock entries without forced major upgrades
        run: |
          npm install --package-lock-only --ignore-scripts --no-fund
          npm audit fix --package-lock-only --ignore-scripts --no-fund || true
          npm audit --omit=dev --audit-level=low
      - name: Confirm repaired dependencies and core tests
        run: |
          npm ci
          npm run contracts:verify
          npm test
          npm run security:scan
      - name: Commit repaired lockfile to the existing review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile changes required"
          else
            git commit -m "fix(deps): resolve npm production dependency audit"
            git push origin HEAD:design/floorops-sitewide-typography-20261027
          fi
