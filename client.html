<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#070807" />
    <meta name="description" content="Private OnlyTruePerspective client portal for project status, documents, payment steps, and approvals." />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="referrer" content="no-referrer" />
    <meta name="otp-api-base" content="" />
    <title>OTP Client Portal</title>
    <link rel="stylesheet" href="/client.css?v=20260702-client-portal-v2" />
  </head>
  <body>
    <main class="portal-shell">
      <header class="portal-header">
        <div class="brand-lockup">
          <span class="logo-mark">
            <img src="/assets/otp-logo-transparent.png" alt="OTP" />
          </span>
          <div>
            <p>OnlyTruePerspective LLC — Private Client Profile</p>
            <h1>Private Client Portal</h1>
          </div>
        </div>
        <span id="portal-status" class="status-pill">Loading</span>
      </header>

      <section id="portal-root" class="portal-root">
        <div class="loading-card">
          <span></span>
          <div>
            <p>Loading your project portal...</p>
            <small>Loading documents and payment status...</small>
          </div>
        </div>
      </section>

      <footer class="portal-footer" style="padding: 16px; text-align: center; font-size: 12px; opacity: 0.6;">
        Powered by OnlyTruePerspective LLC
      </footer>
    </main>
    <script type="module" src="/client.js?v=20260702-client-portal-v2"></script>
  </body>
</html>
